<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${councilId == null ? 'Tạo hội đồng' : 'Sửa hội đồng'}">Hội đồng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet">
</head>
<body class="admin-page">
<div class="admin-dashboard admin-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='councils', role='ADMIN')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}"></div>
        <main class="admin-content admin-form-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading"><div><div class="admin-eyebrow">HỘI ĐỒNG / CẤU HÌNH</div><h1 th:text="${councilId == null ? 'Tạo hội đồng' : 'Sửa hội đồng'}">Tạo hội đồng</h1><p>Thiết lập thông tin học kỳ và phân công ba vai trò bắt buộc.</p></div><a class="admin-secondary-action" th:href="@{/admin/councils}"><i class="bi bi-arrow-left"></i><span>Quay lại danh sách</span></a></div>
            <form method="post" th:object="${councilForm}" th:action="${councilId == null} ? @{/admin/councils} : @{/admin/councils/{id}(id=${councilId})}" class="admin-form-panel">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-building"></i><div><strong>Thông tin hội đồng</strong><span>Định danh hội đồng theo năm học và học kỳ.</span></div></div><div class="admin-form-grid">
                    <div class="admin-field full"><label for="name">Tên hội đồng</label><input id="name" type="text" th:field="*{name}" th:errorclass="is-invalid" placeholder="Ví dụ: Hội đồng bảo vệ KLT 01"><div class="invalid-feedback" th:errors="*{name}"></div></div>
                    <div class="admin-field"><label for="academicYear">Năm học</label><input id="academicYear" type="text" th:field="*{academicYear}" th:errorclass="is-invalid" placeholder="2025-2026"><div class="invalid-feedback" th:errors="*{academicYear}"></div></div>
                    <div class="admin-field"><label for="semester">Học kỳ</label><input id="semester" type="text" th:field="*{semester}" th:errorclass="is-invalid" placeholder="Học kỳ 1"><div class="invalid-feedback" th:errors="*{semester}"></div></div>
                </div></div>
                <div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-person-badge"></i><div><strong>Phân công thành viên</strong><span>Mỗi vai trò cần một giảng viên khác nhau.</span></div></div><div class="admin-form-grid">
                    <div class="admin-field"><label for="chairId">Chủ tịch</label><select id="chairId" th:field="*{chairId}" th:errorclass="is-invalid"><option value="">Chọn giảng viên</option><option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.label}"></option></select><div class="invalid-feedback" th:errors="*{chairId}"></div></div>
                    <div class="admin-field"><label for="secretaryId">Thư ký</label><select id="secretaryId" th:field="*{secretaryId}" th:errorclass="is-invalid"><option value="">Chọn giảng viên</option><option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.label}"></option></select><div class="invalid-feedback" th:errors="*{secretaryId}"></div></div>
                    <div class="admin-field"><label for="memberId">Ủy viên</label><select id="memberId" th:field="*{memberId}" th:errorclass="is-invalid"><option value="">Chọn giảng viên</option><option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.label}"></option></select><div class="invalid-feedback" th:errors="*{memberId}"></div></div>
                </div></div>
                <div class="admin-form-footer"><span><i class="bi bi-info-circle"></i> Không chọn trùng giảng viên giữa các vai trò.</span><button class="admin-primary-action" type="submit"><i class="bi bi-check2"></i><span th:text="${councilId == null ? 'Tạo hội đồng' : 'Lưu thay đổi'}">Tạo hội đồng</span></button></div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
