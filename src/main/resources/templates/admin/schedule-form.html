<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo lịch bảo vệ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet">
</head>
<body class="admin-page">
<div class="admin-dashboard admin-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='schedules', role='ADMIN')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}"></div>
        <main class="admin-content admin-form-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading"><div><div class="admin-eyebrow">LỊCH BẢO VỆ / TẠO MỚI</div><h1>Tạo lịch bảo vệ</h1><p>Phân công đề tài, hội đồng, phòng và khung giờ bảo vệ.</p></div><a class="admin-secondary-action" th:href="@{/admin/schedules}"><i class="bi bi-arrow-left"></i><span>Quay lại danh sách</span></a></div>
            <form method="post" th:action="@{/admin/schedules}" th:object="${scheduleForm}" class="admin-form-panel">
                <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-diagram-3"></i><div><strong>Phân công bảo vệ</strong><span>Chọn đề tài đã duyệt và hội đồng phụ trách.</span></div></div><div class="admin-form-grid">
                    <div class="admin-field full"><label for="thesisId">Đề tài đã duyệt</label><select id="thesisId" th:field="*{thesisId}" th:errorclass="is-invalid"><option value="">Chọn đề tài</option><option th:each="thesis : ${theses}" th:value="${thesis.id}" th:text="${thesis.label}"></option></select><div class="invalid-feedback" th:errors="*{thesisId}"></div></div>
                    <div class="admin-field full"><label for="councilId">Hội đồng</label><select id="councilId" th:field="*{councilId}" th:errorclass="is-invalid"><option value="">Chọn hội đồng</option><option th:each="council : ${councils}" th:value="${council.id}" th:text="${council.label}"></option></select><div class="invalid-feedback" th:errors="*{councilId}"></div></div>
                </div></div>
                <div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-calendar2-week"></i><div><strong>Thời gian và địa điểm</strong><span>Các ca bảo vệ cần cách nhau tối thiểu 15 phút.</span></div></div><div class="admin-form-grid">
                    <div class="admin-field"><label for="room">Phòng bảo vệ</label><input id="room" type="text" th:field="*{room}" th:errorclass="is-invalid" placeholder="Ví dụ: A101"><div class="invalid-feedback" th:errors="*{room}"></div></div>
                    <div class="admin-field"><label for="startTime">Bắt đầu</label><input id="startTime" type="datetime-local" th:field="*{startTime}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{startTime}"></div></div>
                    <div class="admin-field"><label for="endTime">Kết thúc</label><input id="endTime" type="datetime-local" th:field="*{endTime}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{endTime}"></div></div>
                </div></div>
                <div class="admin-form-footer"><span><i class="bi bi-shield-check"></i> Hệ thống sẽ kiểm tra trùng lịch và xung đột phòng.</span><button class="admin-primary-action" type="submit"><i class="bi bi-calendar-plus"></i><span>Tạo lịch bảo vệ</span></button></div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
