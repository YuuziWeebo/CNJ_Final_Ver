<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet">
</head>
<body class="admin-page">
<div class="admin-dashboard admin-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='users', role='ADMIN')}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}"></div>
        <main class="admin-content admin-form-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading"><div><div class="admin-eyebrow">TÀI KHOẢN / TẠO MỚI</div><h1>Tạo tài khoản</h1><p>Thêm người dùng mới và cấp quyền truy cập cho hệ thống.</p></div><a class="admin-secondary-action" th:href="@{/admin/users}"><i class="bi bi-arrow-left"></i><span>Quay lại danh sách</span></a></div>
            <form method="post" th:action="@{/admin/users}" th:object="${userForm}" class="admin-form-panel">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-person-lock"></i><div><strong>Thông tin đăng nhập</strong><span>Thiết lập thông tin truy cập hệ thống.</span></div></div><div class="admin-form-grid">
                    <div class="admin-field"><label for="username">Tên đăng nhập</label><input id="username" type="text" th:field="*{username}" th:errorclass="is-invalid" placeholder="Ví dụ: nguyenvana"><div class="invalid-feedback" th:errors="*{username}"></div></div>
                    <div class="admin-field"><label for="password">Mật khẩu ban đầu</label><input id="password" type="password" th:field="*{password}" th:errorclass="is-invalid" placeholder="Nhập mật khẩu"><div class="invalid-feedback" th:errors="*{password}"></div></div>
                    <div class="admin-field"><label for="role">Vai trò</label><select id="role" th:field="*{role}" th:errorclass="is-invalid"><option value="">Chọn vai trò</option><option th:each="role : ${T(com.glucoze.thesismanagement.common.enums.Role).values()}" th:value="${role.name()}" th:text="${role}"></option></select><div class="invalid-feedback" th:errors="*{role}"></div></div>
                </div></div>
                <div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-person-vcard"></i><div><strong>Thông tin hồ sơ</strong><span>Bổ sung thông tin theo vai trò tài khoản.</span></div></div><div class="admin-form-grid">
                    <div class="admin-field"><label for="fullName">Họ và tên</label><input id="fullName" type="text" th:field="*{fullName}" th:errorclass="is-invalid" placeholder="Nhập họ và tên"><div class="invalid-feedback" th:errors="*{fullName}"></div></div>
                    <div class="admin-field"><label for="studentCode">Mã sinh viên</label><input id="studentCode" type="text" th:field="*{studentCode}" th:errorclass="is-invalid" placeholder="Dành cho sinh viên"><div class="invalid-feedback" th:errors="*{studentCode}"></div></div>
                    <div class="admin-field"><label for="className">Lớp</label><input id="className" type="text" th:field="*{className}" th:errorclass="is-invalid" placeholder="Dành cho sinh viên"><div class="invalid-feedback" th:errors="*{className}"></div></div>
                    <div class="admin-field"><label for="lecturerCode">Mã giảng viên</label><input id="lecturerCode" type="text" th:field="*{lecturerCode}" th:errorclass="is-invalid" placeholder="Dành cho giảng viên"><div class="invalid-feedback" th:errors="*{lecturerCode}"></div></div>
                    <div class="admin-field"><label for="department">Bộ môn</label><input id="department" type="text" th:field="*{department}" th:errorclass="is-invalid" placeholder="Dành cho giảng viên"><div class="invalid-feedback" th:errors="*{department}"></div></div>
                </div></div>
                <div class="admin-form-footer"><span><i class="bi bi-info-circle"></i> Kiểm tra kỹ vai trò trước khi tạo.</span><button class="admin-primary-action" type="submit"><i class="bi bi-check2"></i><span>Tạo tài khoản</span></button></div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
