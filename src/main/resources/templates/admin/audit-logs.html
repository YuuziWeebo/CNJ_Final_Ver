<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><script th:src="@{/js/theme-init.js}"></script><script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nhật ký hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet"></head>
<body><div class="admin-dashboard"><div th:replace="~{fragments/sidebar :: sidebar(activePage='audit-logs', role='ADMIN')}"></div><div class="admin-main"><div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText='A')}"></div>
<main class="admin-content"><div class="dashboard-page-heading"><div><h1>Nhật ký hệ thống</h1><p>Lịch sử chỉ đọc của các thay đổi đã hoàn tất trong hệ thống.</p></div></div>
<form class="panel-filter audit-filter" method="get" th:action="@{/admin/audit-logs}"><div class="panel-filter-field"><label for="actor">Người thực hiện</label><input class="form-control" id="actor" name="actor" th:value="${actor}" maxlength="100"></div><div class="panel-filter-field"><label for="action">Hành động</label><select class="form-select" id="action" name="action"><option value="">Tất cả</option><option th:each="item : ${actions}" th:value="${item}" th:text="${item}" th:selected="${item == selectedAction}"></option></select></div><div class="panel-filter-field"><label for="entityType">Loại đối tượng</label><select class="form-select" id="entityType" name="entityType"><option value="">Tất cả</option><option th:each="item : ${entityTypes}" th:value="${item}" th:text="${item}" th:selected="${item == selectedEntityType}"></option></select></div><div class="panel-filter-field"><label for="from">Từ ngày</label><input class="form-control" id="from" name="from" type="date" th:value="${from}"></div><div class="panel-filter-field"><label for="to">Đến ngày</label><input class="form-control" id="to" name="to" type="date" th:value="${to}"></div><button class="panel-icon-action is-primary" type="submit"><i class="bi bi-funnel" aria-hidden="true"></i>Lọc</button></form>
<section class="dashboard-section"><div class="panel-empty" th:if="${auditLogs.empty}"><div><i class="bi bi-clock-history" aria-hidden="true"></i><strong>Chưa có nhật ký phù hợp</strong><span>Thử thay đổi bộ lọc hoặc thực hiện một nghiệp vụ.</span></div></div><div class="panel-table-wrap" th:unless="${auditLogs.empty}"><table class="panel-table audit-table"><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th>Mô tả</th></tr></thead><tbody><tr th:each="log : ${auditLogs.content}"><td th:text="${#temporals.format(log.createdAt,'dd/MM/yyyy HH:mm:ss')}">Time</td><td><strong class="panel-title" th:text="${log.actorUsername}">actor</strong></td><td><span class="status-badge is-info" th:text="${log.action}">ACTION</span></td><td><span th:text="${log.entityType}">TYPE</span><span class="panel-meta" th:text="${log.entityId != null ? '#' + log.entityId : '—'}">#1</span></td><td class="audit-description" th:text="${log.description}">Description</td></tr></tbody></table></div></section>
<nav class="notification-pagination" th:if="${auditLogs.totalPages > 1}" aria-label="Phân trang nhật ký"><a class="panel-icon-action" th:if="${auditLogs.hasPrevious()}" th:href="@{/admin/audit-logs(page=${auditLogs.number - 1},actor=${actor},action=${selectedAction},entityType=${selectedEntityType},from=${from},to=${to})}">Trang trước</a><span th:text="${'Trang ' + (auditLogs.number + 1) + ' / ' + auditLogs.totalPages}">Trang</span><a class="panel-icon-action" th:if="${auditLogs.hasNext()}" th:href="@{/admin/audit-logs(page=${auditLogs.number + 1},actor=${actor},action=${selectedAction},entityType=${selectedEntityType},from=${from},to=${to})}">Trang sau</a></nav>
</main></div></div></body></html>
