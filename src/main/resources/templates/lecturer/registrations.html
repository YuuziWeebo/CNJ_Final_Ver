<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet"></head>
<body class="lecturer-page">
<div class="lecturer-dashboard lecturer-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='registrations', role='LECTURER')}"></div>
    <div class="lecturer-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}" ></div>
        <main class="lecturer-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading lecturer-heading"><div><h1>Đăng ký đề tài</h1><p>Phê duyệt các đơn đăng ký sinh viên.</p></div><div class="panel-heading-actions"><a class="admin-secondary-action" th:href="@{/lecturer/theses}"><i class="bi bi-file-earmark-text"></i><span>Đề tài của tôi</span></a></div></div>
            <section class="panel-surface" aria-labelledby="registration-list-title"><h2 id="registration-list-title" class="visually-hidden">Danh sách đăng ký đề tài</h2><div class="panel-empty" th:if="${#lists.isEmpty(registrations)}"><div><i class="bi bi-clipboard2-check" aria-hidden="true"></i><strong>Chưa có đăng ký</strong><span>Không có đơn đăng ký nào cần xử lý lúc này.</span></div></div><div class="panel-table-wrap" th:unless="${#lists.isEmpty(registrations)}"><table class="panel-table"><thead><tr><th>Đề tài</th><th>Sinh viên</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="registration : ${registrations}"><td><span class="panel-title" th:text="${registration.thesisTitle}"></span></td><td><span class="panel-title" th:text="${registration.studentName ?: 'Chưa có sinh viên'}"></span></td><td><span class="status-badge" th:classappend="${registration.status.name() == 'APPROVED' ? ' is-success' : (registration.status.name() == 'REJECTED' ? ' is-danger' : ' is-warning')}" th:text="${registration.status}"></span></td><td><span th:if="${registration.status.name() != 'PENDING'}" class="panel-meta">Đã xử lý</span><div class="panel-actions" th:if="${registration.status.name() == 'PENDING'}"><form method="post" th:action="@{/lecturer/registrations/{id}/approve(id=${registration.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="panel-icon-action is-success" type="submit"><i class="bi bi-check2" aria-hidden="true"></i><span>Duyệt</span></button></form><form method="post" th:action="@{/lecturer/registrations/{id}/reject(id=${registration.id})}" th:attr="data-confirm=|Từ chối đăng ký đề tài ‘${registration.thesisTitle}’ của ${registration.studentName}?|"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="panel-icon-action is-danger" type="submit"><i class="bi bi-x-lg" aria-hidden="true"></i><span>Từ chối</span></button></form></div></td></tr></tbody></table></div></section>
        </main>
    </div>
</div>
<script th:src="@{/js/confirm-actions.js}" defer></script>
</body>
</html>
