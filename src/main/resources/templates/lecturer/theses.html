<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề tài hướng dẫn</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet">
</head>
<body class="lecturer-page">
<div class="lecturer-dashboard lecturer-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='theses', role='LECTURER')}"></div>
    <div class="lecturer-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}" ></div>
        <main class="lecturer-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading lecturer-heading">
                <div><h1>Đề tài hướng dẫn</h1><p>Tạo và quản lý đề tài cho sinh viên.</p></div>
                <div class="panel-heading-actions"><a class="admin-secondary-action" th:href="@{/lecturer/registrations}"><i class="bi bi-clipboard-check"></i><span>Đăng ký đề tài</span></a><a class="admin-primary-action" th:href="@{/lecturer/theses/new}"><i class="bi bi-plus-lg"></i><span>Tạo đề tài</span></a></div>
            </div>
            <section class="panel-surface" aria-labelledby="thesis-list-title">
                <h2 id="thesis-list-title" class="visually-hidden">Danh sách đề tài hướng dẫn</h2>
                <div class="panel-empty" th:if="${#lists.isEmpty(theses)}"><div><i class="bi bi-journal-plus" aria-hidden="true"></i><strong>Chưa có đề tài</strong><span>Tạo đề tài đầu tiên để bắt đầu hướng dẫn sinh viên.</span></div></div>
                <div class="panel-table-wrap" th:unless="${#lists.isEmpty(theses)}">
                    <table class="panel-table"><thead><tr><th>Đề tài</th><th>Năm học / học kỳ</th><th>Thao tác</th></tr></thead>
                        <tbody><tr th:each="thesis : ${theses}"><td><span class="panel-title" th:text="${thesis.title}"></span><span class="panel-meta" th:if="${thesis.description != null and !#strings.isEmpty(thesis.description)}" th:text="${thesis.description}"></span></td><td><span class="panel-title" th:text="${thesis.academicYear + ' / ' + thesis.semester}"></span></td><td><div class="panel-actions"><a class="panel-icon-action" th:href="@{/lecturer/theses/{id}/edit(id=${thesis.id})}"><i class="bi bi-pencil" aria-hidden="true"></i><span>Sửa</span></a><form method="post" th:action="@{/lecturer/theses/{id}/delete(id=${thesis.id})}" th:attr="data-confirm=|Xóa đề tài ‘${thesis.title}’? Thao tác này không thể hoàn tác.|"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="panel-icon-action is-danger" type="submit"><i class="bi bi-trash3" aria-hidden="true"></i><span>Xóa</span></button></form></div></td></tr></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/confirm-actions.js}" defer></script>
</body>
</html>
