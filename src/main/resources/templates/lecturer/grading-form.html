<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nhập điểm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet"></head>
<body class="lecturer-page">
<div class="lecturer-dashboard lecturer-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='grading', role='LECTURER')}"></div>
    <div class="lecturer-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}"></div>
        <main class="lecturer-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading lecturer-heading"><div><h1 th:text="${grade.thesisTitle}">Điểm</h1><p>Điểm được kiểm tra trong khoảng từ 0 đến 10.</p></div><a class="admin-secondary-action" th:href="@{/lecturer/grading}"><i class="bi bi-arrow-left"></i><span>Quay lại</span></a></div>
            <div class="admin-grid grading-stats"><div class="admin-stat-card"><div class="admin-stat-icon teal"><i class="bi bi-person-check"></i></div><div class="admin-stat-value" th:text="${grade.supervisorScore ?: 'Chưa có'}">0</div><div class="admin-stat-label">Điểm GVHD</div></div><div class="admin-stat-card"><div class="admin-stat-icon indigo"><i class="bi bi-people"></i></div><div class="admin-stat-value" th:text="${grade.councilScore ?: 'Chưa có'}">0</div><div class="admin-stat-label">Điểm hội đồng</div></div><div class="admin-stat-card"><div class="admin-stat-icon rose"><i class="bi bi-award"></i></div><div class="admin-stat-value" th:text="${grade.published ? grade.finalScore : 'Chưa công bố'}">0</div><div class="admin-stat-label">Kết quả cuối cùng</div></div></div>
            <div class="grading-form-grid">
                <form class="admin-form-panel" method="post" th:action="@{/lecturer/grading/{id}/supervisor-score(id=${grade.scheduleId})}" th:object="${scoreForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-pencil-square"></i><div><strong>Điểm GVHD</strong><span>Nhập điểm cá nhân của giảng viên hướng dẫn.</span></div></div><div class="admin-form-grid"><div class="admin-field full"><label for="score">Điểm GVHD</label><input class="form-control" id="score" type="number" min="0" max="10" step="0.1" th:field="*{score}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{score}"></div></div></div></div><div class="admin-form-footer"><button class="admin-primary-action" type="submit"><i class="bi bi-check2"></i><span>Lưu điểm GVHD</span></button></div></form>
                <form class="admin-form-panel" method="post" th:action="@{/lecturer/grading/{id}/council-score(id=${grade.scheduleId})}" th:object="${scoreForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-people-fill"></i><div><strong>Điểm hội đồng</strong><span>Nhập điểm từ hội đồng bảo vệ.</span></div></div><div class="admin-form-grid"><div class="admin-field full"><label for="councilScore">Điểm hội đồng</label><input class="form-control" id="councilScore" type="number" min="0" max="10" step="0.1" th:field="*{score}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{score}"></div></div></div></div><div class="admin-form-footer"><button class="admin-primary-action" type="submit"><i class="bi bi-check2"></i><span>Lưu điểm hội đồng</span></button></div></form>
            </div>
            <form class="admin-form-panel grading-publish" method="post" th:action="@{/lecturer/grading/{id}/publish(id=${grade.scheduleId})}" data-confirm="Công bố kết quả? Sau khi công bố, điểm không thể chỉnh sửa qua quy trình thông thường."><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="admin-form-footer"><span><i class="bi bi-info-circle"></i> Sau khi công bố, sinh viên có thể xem kết quả.</span><button class="admin-primary-action" type="submit" th:disabled="${grade.published}"><i class="bi bi-send"></i><span>Công bố kết quả</span></button></div></form>
        </main>
    </div>
</div>
<script th:src="@{/js/confirm-actions.js}" defer></script>
</body></html>
