<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chấm điểm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet"></head>
<body class="lecturer-page">
<div class="lecturer-dashboard lecturer-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='grading', role='LECTURER')}"></div>
    <div class="lecturer-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}" ></div>
        <main class="lecturer-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading lecturer-heading"><div><h1>Chấm điểm bảo vệ</h1><p>Điểm giảng viên hướng dẫn chiếm 40% và điểm hội đồng chiếm 60%.</p></div><div class="panel-heading-actions"><a class="admin-secondary-action" th:href="@{/lecturer/theses}"><i class="bi bi-file-earmark-text"></i><span>Đề tài của tôi</span></a></div></div>
            <section class="panel-surface" aria-labelledby="grading-list-title"><h2 id="grading-list-title" class="visually-hidden">Danh sách chấm điểm</h2><div class="panel-empty" th:if="${#lists.isEmpty(grades)}"><div><i class="bi bi-pencil-square" aria-hidden="true"></i><strong>Chưa có lịch chấm điểm</strong><span>Bạn chưa được phân công lịch bảo vệ nào.</span></div></div><div class="panel-table-wrap" th:unless="${#lists.isEmpty(grades)}"><table class="panel-table"><thead><tr><th>Đề tài</th><th>Điểm GVHD</th><th>Điểm hội đồng</th><th>Kết quả</th><th>Thao tác</th></tr></thead><tbody><tr th:each="grade : ${grades}"><td><span class="panel-title" th:text="${grade.thesisTitle}"></span></td><td th:text="${grade.supervisorScore ?: 'Chưa có'}"></td><td th:text="${grade.councilScore ?: 'Chưa có'}"></td><td><span class="status-badge" th:classappend="${grade.published ? ' is-success' : ' is-warning'}" th:text="${grade.published ? grade.finalScore : 'Chưa công bố'}"></span></td><td><a class="panel-icon-action" th:href="@{/lecturer/grading/{id}(id=${grade.scheduleId})}"><i class="bi bi-arrow-right-circle" aria-hidden="true"></i><span>Mở chấm điểm</span></a></td></tr></tbody></table></div></section>
        </main>
    </div>
</div>
</body>
</html>
