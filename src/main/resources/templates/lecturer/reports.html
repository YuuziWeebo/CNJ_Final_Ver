<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Duyệt báo cáo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet"></head>
<body class="lecturer-page">
<div class="lecturer-dashboard lecturer-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='reports', role='LECTURER')}"></div>
    <div class="lecturer-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}" ></div>
        <main class="lecturer-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading lecturer-heading"><div><h1>Duyệt báo cáo</h1><p>Kiểm tra và phê duyệt báo cáo của sinh viên.</p></div><div class="panel-heading-actions"><a class="admin-secondary-action" th:href="@{/lecturer/registrations}"><i class="bi bi-clipboard-check"></i><span>Đăng ký đề tài</span></a></div></div>
            <div class="panel-surface panel-empty" th:if="${#lists.isEmpty(reports)}"><div><i class="bi bi-file-earmark-check" aria-hidden="true"></i><strong>Chưa có báo cáo</strong><span>Không có báo cáo đã nộp cần duyệt lúc này.</span></div></div>
            <section class="report-list" aria-label="Danh sách báo cáo" th:unless="${#lists.isEmpty(reports)}">
                <article class="report-row" th:each="report : ${reports}">
                    <div class="report-row-main">
                        <div class="report-row-head"><div><h2 class="panel-title mb-0" th:text="${report.thesisTitle}"></h2><span class="panel-meta"><i class="bi bi-person" aria-hidden="true"></i> <span th:text="${report.studentName ?: 'Chưa có sinh viên'}"></span></span></div><span class="status-badge" th:classappend="${report.status.name() == 'APPROVED' ? ' is-success' : (report.status.name() == 'REVISION_REQUIRED' ? ' is-warning' : (report.status.name() == 'SUBMITTED' ? ' is-info' : ' is-neutral'))}" th:text="${report.status}"></span></div>
                        <p class="report-review" th:if="${report.review}" th:text="${report.review}"></p>
                    </div>
                    <div class="report-row-actions">
                        <a class="panel-icon-action" th:if="${report.file != null and #strings.startsWith(report.file, 'reports/')}" th:href="@{/lecturer/reports/file/{id}(id=${report.id})}"><i class="bi bi-file-earmark-arrow-down" aria-hidden="true"></i><span>Tải báo cáo đính kèm</span></a>
                        <a class="panel-icon-action" th:if="${report.file != null and #strings.startsWith(report.file, 'https://')}" th:href="${report.file}" target="_blank" rel="noopener noreferrer"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i><span>Mở báo cáo</span></a>
                        <div th:if="${report.status.name() == 'SUBMITTED'}">
                            <form class="report-review-form mb-2" method="post" th:action="@{/lecturer/reports/{id}/request-changes(id=${report.id})}" th:object="${reviewForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="visually-hidden" th:for="|changeReview-${report.id}|">Nhận xét yêu cầu chỉnh sửa</label><textarea class="form-control" th:id="|changeReview-${report.id}|" th:field="*{feedback}" placeholder="Ghi chú nhận xét"></textarea><button class="panel-icon-action" type="submit"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i><span>Yêu cầu chỉnh sửa</span></button></form>
                            <form class="report-review-form" method="post" th:action="@{/lecturer/reports/{id}/approve(id=${report.id})}" th:object="${reviewForm}" th:attr="data-confirm=|Duyệt báo cáo ‘${report.thesisTitle}’?|"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="visually-hidden" th:for="|approveReview-${report.id}|">Nhận xét duyệt báo cáo</label><textarea class="form-control" th:id="|approveReview-${report.id}|" th:field="*{feedback}" placeholder="Ghi chú duyệt"></textarea><button class="panel-icon-action is-success" type="submit"><i class="bi bi-check2-circle" aria-hidden="true"></i><span>Duyệt báo cáo</span></button></form>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/confirm-actions.js}" defer></script>
</body>
</html>
