<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề tài khóa luận</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet">
</head>
<body class="lecturer-page">
<div class="lecturer-dashboard lecturer-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='theses', role='LECTURER')}"></div>
    <div class="lecturer-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}"></div>
        <main class="lecturer-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading lecturer-heading"><div><h1 th:text="${thesisId == null ? 'Tạo đề tài' : 'Sửa đề tài'}">Đề tài</h1><p>Quản lý thông tin và kì học của đề tài.</p></div><a class="admin-secondary-action" th:href="@{/lecturer/theses}"><i class="bi bi-arrow-left"></i><span>Quay lại</span></a></div>
            <form method="post" th:object="${thesisForm}" th:action="${thesisId == null} ? @{/lecturer/theses} : @{/lecturer/theses/{id}(id=${thesisId})}" class="admin-form-panel">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="admin-form-section"><div class="admin-form-section-title"><i class="bi bi-file-earmark-text"></i><div><strong>Thông tin đề tài</strong><span>Điền tên, mô tả và thời gian thực hiện.</span></div></div><div class="admin-form-grid"><div class="admin-field full"><label for="title">Tên đề tài</label><input class="form-control" id="title" th:field="*{title}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{title}"></div></div><div class="admin-field full"><label for="description">Mô tả</label><textarea class="form-control" id="description" rows="5" th:field="*{description}" th:errorclass="is-invalid"></textarea><div class="invalid-feedback" th:errors="*{description}"></div></div><div class="admin-field"><label for="academicYear">Năm học</label><input class="form-control" id="academicYear" th:field="*{academicYear}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{academicYear}"></div></div><div class="admin-field"><label for="semester">Học kỳ</label><input class="form-control" id="semester" th:field="*{semester}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{semester}"></div></div></div></div>
                <div class="admin-form-footer"><button class="admin-primary-action" type="submit"><i class="bi bi-check2"></i><span>Lưu đề tài</span></button></div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
