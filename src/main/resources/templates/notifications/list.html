<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><script th:src="@{/js/theme-init.js}"></script><script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet"></head>
<body><div class="dashboard-shell" th:classappend="${notificationRole == 'ADMIN' ? ' admin-dashboard' : (notificationRole == 'LECTURER' ? ' lecturer-dashboard' : ' student-dashboard')}">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='notifications', role=${notificationRole})}"></div>
    <div class="dashboard-main" th:classappend="${notificationRole == 'ADMIN' ? ' admin-main' : (notificationRole == 'LECTURER' ? ' lecturer-main' : ' student-main')}">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText='N')}"></div>
        <main class="dashboard-content" th:classappend="${notificationRole == 'ADMIN' ? ' admin-content' : (notificationRole == 'LECTURER' ? ' lecturer-content' : ' student-content')}">
            <div class="dashboard-page-heading"><div><h1>Thông báo</h1><p th:text="${notificationUnreadCount > 0 ? notificationUnreadCount + ' thông báo chưa đọc' : 'Bạn đã đọc tất cả thông báo'}">Thông báo</p></div>
                <form method="post" th:if="${notificationUnreadCount > 0}" th:action="@{/notifications/read-all}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="panel-icon-action is-primary" type="submit"><i class="bi bi-check2-all" aria-hidden="true"></i>Đánh dấu tất cả đã đọc</button></form></div>
            <section class="dashboard-section"><div class="panel-empty" th:if="${notifications.empty}"><div><i class="bi bi-bell" aria-hidden="true"></i><strong>Chưa có thông báo</strong><span>Các cập nhật nghiệp vụ liên quan đến bạn sẽ xuất hiện tại đây.</span></div></div>
                <div class="notification-list" th:unless="${notifications.empty}"><article class="notification-item" th:each="item : ${notifications.content}" th:classappend="${item.read ? '' : ' is-unread'}">
                    <div class="notification-indicator" aria-hidden="true"></div><div class="notification-copy"><div class="notification-item-heading"><h2 th:text="${item.title}">Tiêu đề</h2><span class="status-badge" th:classappend="${item.read ? '' : ' is-info'}" th:text="${item.read ? 'Đã đọc' : 'Chưa đọc'}">Chưa đọc</span></div><p th:text="${item.message}">Nội dung</p><time th:datetime="${item.createdAt}" th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</time><a class="dashboard-link" th:href="${item.targetUrl}">Xem chi tiết <i class="bi bi-arrow-right" aria-hidden="true"></i></a></div>
                    <form method="post" th:unless="${item.read}" th:action="@{/notifications/{id}/read(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="panel-icon-action" type="submit"><i class="bi bi-check2" aria-hidden="true"></i>Đã đọc</button></form></article></div>
            </section>
            <nav class="notification-pagination" th:if="${notifications.totalPages > 1}" aria-label="Phân trang thông báo"><a class="panel-icon-action" th:if="${notifications.hasPrevious()}" th:href="@{/notifications(page=${notifications.number - 1})}">Trang trước</a><span th:text="${'Trang ' + (notifications.number + 1) + ' / ' + notifications.totalPages}">Trang</span><a class="panel-icon-action" th:if="${notifications.hasNext()}" th:href="@{/notifications(page=${notifications.number + 1})}">Trang sau</a></nav>
        </main></div></div></body></html>
