<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Điểm của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet"></head>
<body class="student-page">
<div class="student-dashboard student-dashboard-page">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='grading', role='STUDENT')}"></div>
    <div class="student-main">
        <div th:replace="~{fragments/header :: header(userName=${currentUserName}, avatarUrl=${currentAvatarUrl}, avatarText=null)}" ></div>
        <main class="student-content">
            <div th:replace="~{fragments/admin/alerts :: alerts}"></div>
            <div class="admin-heading student-heading"><div><h1>Kết quả cuối cùng của tôi</h1><p>Điểm được hiển thị sau khi hội đồng công bố kết quả.</p></div><div class="panel-heading-actions"><a class="admin-secondary-action" th:href="@{/student/theses}"><i class="bi bi-file-text"></i><span>Đề tài của tôi</span></a></div></div>
            <section class="panel-surface" aria-labelledby="student-grades-title"><h2 id="student-grades-title" class="visually-hidden">Danh sách kết quả đã công bố</h2><div class="panel-empty" th:if="${#lists.isEmpty(grades)}"><div><i class="bi bi-award" aria-hidden="true"></i><strong>Chưa có kết quả</strong><span>Hiện chưa có kết quả nào được công bố.</span></div></div><div class="panel-table-wrap" th:unless="${#lists.isEmpty(grades)}"><table class="panel-table"><thead><tr><th>Đề tài</th><th>Điểm GVHD</th><th>Điểm hội đồng</th><th>Kết quả cuối cùng</th></tr></thead><tbody><tr th:each="grade : ${grades}"><td><span class="panel-title" th:text="${grade.thesisTitle}"></span></td><td th:text="${grade.supervisorScore}"></td><td th:text="${grade.councilScore}"></td><td><span class="grade-result"><i class="bi bi-award" aria-hidden="true"></i><strong th:text="${grade.finalScore}"></strong></span></td></tr></tbody></table></div></section>
        </main>
    </div>
</div>
</body>
</html>
