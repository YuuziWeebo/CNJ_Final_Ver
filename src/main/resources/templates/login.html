<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/theme.js(v='20260910.4')}" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Quản lý khóa luận</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css(v='20260910.4')}" rel="stylesheet">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
        <div class="login-mark" aria-hidden="true"><i class="bi bi-mortarboard-fill"></i></div>
        <p class="login-eyebrow">QUẢN LÝ KHÓA LUẬN</p>
        <h1 id="login-title">Chào mừng trở lại</h1>
        <p class="login-subtitle">Đăng nhập để tiếp tục.</p>

        <div class="alert alert-danger login-alert" th:if="${param.error}">
            Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        <div class="alert alert-success login-alert" th:if="${param.logout}">
            Bạn đã đăng xuất thành công.
        </div>

        <form method="post" th:action="@{/login}" class="login-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <div class="login-input-wrap">
                    <i class="bi bi-person" aria-hidden="true"></i>
                    <input class="form-control" id="username" name="username" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Mật khẩu</label>
                <div class="login-input-wrap">
                    <i class="bi bi-lock" aria-hidden="true"></i>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                </div>
            </div>
            <button class="btn btn-primary login-submit w-100" type="submit">
                <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Đăng nhập
            </button>
        </form>
    </section>
</main>
</body>
</html>
